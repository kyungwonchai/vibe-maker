<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>바이브 제작 / 수정 (Vibe Maker)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪄</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131b2e;
      --card-border: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #8b5cf6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      line-height: 1.5;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(139, 92, 246, 0.2));
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 1px solid rgba(139, 92, 246, 0.3);
    }

    .logo-text h1 {
      font-size: 1.15rem;
      font-weight: 800;
      background: linear-gradient(90deg, #60a5fa, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-text p {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 999px;
      font-size: 0.75rem;
      color: #34d399;
      font-weight: 600;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Card Box */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Mode Switcher */
    .segmented-control {
      display: flex;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      padding: 3px;
      gap: 4px;
    }

    .segment-btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .segment-btn.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.35);
    }

    /* Form Fields */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    select, input[type="text"], textarea {
      width: 100%;
      padding: 12px 14px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    select:focus, input[type="text"]:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
    }

    textarea {
      resize: vertical;
      min-height: 120px;
      line-height: 1.6;
    }

    /* Voice / STT Section */
    .voice-control-box {
      display: flex;
      gap: 8px;
    }

    .mic-btn {
      flex: 1;
      padding: 14px;
      border: 1px solid rgba(239, 68, 68, 0.3);
      background: rgba(239, 68, 68, 0.1);
      color: #fca5a5;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mic-btn.recording {
      background: #ef4444;
      color: white;
      border-color: #ef4444;
      animation: micPulse 1.2s infinite alternate;
    }

    @keyframes micPulse {
      from { box-shadow: 0 0 8px rgba(239, 68, 68, 0.4); }
      to { box-shadow: 0 0 20px rgba(239, 68, 68, 0.85); }
    }

    .stt-lang-btn {
      padding: 0 14px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .interim-preview {
      font-size: 0.82rem;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 8px 12px;
      border-radius: 6px;
      border-left: 3px solid #38bdf8;
      font-style: italic;
      display: none;
    }

    /* Execute Button */
    .btn-execute {
      padding: 16px;
      border: none;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.35);
      transition: transform 0.15s, opacity 0.15s;
    }

    .btn-execute:active {
      transform: scale(0.98);
    }

    .btn-execute:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Terminal Output Monitor */
    .terminal-card {
      background: #080c14;
      border: 1px solid #1e293b;
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .terminal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
    }

    .terminal-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .terminal-actions {
      display: flex;
      gap: 6px;
    }

    .action-pill {
      padding: 4px 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      color: #cbd5e1;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
    }

    .action-pill.danger {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.3);
    }

    pre.terminal-screen {
      padding: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      line-height: 1.45;
      color: #38bdf8;
      background: #060911;
      max-height: 280px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* Quick Preset Chips */
    .presets-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .presets-bar::-webkit-scrollbar { display: none; }

    .preset-chip {
      padding: 6px 10px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 999px;
      font-size: 0.75rem;
      color: #cbd5e1;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
    }

    .preset-chip:active {
      background: rgba(59, 130, 246, 0.2);
      border-color: var(--primary);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1e293b;
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transition: transform 0.25s ease;
      z-index: 999;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div class="logo-area">
        <div class="logo-icon">🪄</div>
        <div class="logo-text">
          <h1>바이브 제작 / 수정</h1>
          <p>모바일 음성·텍스트로 agy (YOLO) 원격 실행</p>
        </div>
      </div>
      <div class="header-badge">
        <div class="pulse-dot"></div>
        <span id="sessionStatusBadge">세션 대기 중</span>
      </div>
    </header>

    <!-- App Selection / Creation Card -->
    <div class="card">
      <div class="card-title">
        <span>🎯 작업 대상 선택</span>
      </div>

      <!-- Segmented Mode Control -->
      <div class="segmented-control">
        <button class="segment-btn active" id="btnModeModify" onclick="setMode('modify')">
          🛠️ 기존 앱 수정
        </button>
        <button class="segment-btn" id="btnModeCreate" onclick="setMode('create')">
          ✨ 신규 앱 제작
        </button>
      </div>

      <!-- Modify Mode App Dropdown -->
      <div class="form-group" id="groupAppSelect">
        <label class="form-label" for="appSelect">
          <span>앱 폴더 선택 (kwsoft / home)</span>
          <span id="appCount" style="color: #64748b;">로딩 중...</span>
        </label>
        <select id="appSelect" onchange="onAppSelectChange()">
          <option value="">앱 폴더 목록을 불러오는 중...</option>
        </select>
      </div>

      <!-- Create Mode Name Input -->
      <div class="form-group" id="groupNewApp" style="display: none;">
        <label class="form-label" for="newAppName">새 앱 영문 폴더명 (예: my-calculator)</label>
        <input type="text" id="newAppName" placeholder="예: speech-todo, lotto-game, recipe-finder">
      </div>
    </div>

    <!-- Prompt & Voice Command Card -->
    <div class="card">
      <div class="card-title">
        <span>🎙️ 음성 인식 & 작업 명령 (프롬프트)</span>
      </div>

      <!-- Voice Recording Controls -->
      <div class="voice-control-box">
        <button class="mic-btn" id="btnMic" onclick="toggleRecording()">
          <span id="micIcon">🎤</span>
          <span id="micLabel">마이크 음성 인식 시작</span>
        </button>
        <button class="stt-lang-btn" id="btnLang" onclick="toggleLang()">
          🇰🇷 KO
        </button>
      </div>

      <div class="interim-preview" id="interimPreview"></div>

      <!-- Quick Template Chips -->
      <div class="presets-bar">
        <div class="preset-chip" onclick="addPromptSnippet('전체 UI를 모바일 반응형으로 예쁘고 모던하게 리팩토링해줘.')">🎨 모바일 UI 리팩토링</div>
        <div class="preset-chip" onclick="addPromptSnippet('현재 코드의 버그를 찾고 콘솔 오류를 완벽하게 고쳐줘.')">🐛 버그 수정</div>
        <div class="preset-chip" onclick="addPromptSnippet('새로운 다크모드 테마와 로컬스토리지 저장 기능을 추가해줘.')">🌙 다크모드 추가</div>
        <div class="preset-chip" onclick="addPromptSnippet('HTML/JS/CSS 단일 파일로 동작하는 재미있는 미니 웹앱을 완성해줘.')">🚀 미니앱 완성</div>
      </div>

      <!-- Main Prompt Textarea -->
      <div class="form-group">
        <textarea id="promptInput" placeholder="여기에 무엇을 만들거나 수정할지 말하거나 적으세요...&#10;예) 이 앱에 음성 녹음 기능과 자동 저장 버튼을 만들어줘."></textarea>
      </div>

      <!-- Execute YOLO Button -->
      <button class="btn-execute" id="btnExecute" onclick="executeVibe()">
        <span>⚡ agy 실행하기 (YOLO 모드)</span>
      </button>
    </div>

    <!-- Realtime Live Monitor Screen -->
    <div class="terminal-card">
      <div class="terminal-header">
        <div class="terminal-title">
          <span>💻 터미널 실시간 모니터링</span>
        </div>
        <div class="terminal-actions">
          <button class="action-pill" onclick="sendAction('ctrl-c')">⏹️ 중단(Ctrl+C)</button>
          <button class="action-pill danger" onclick="sendAction('kill')">🗑️ 세션 종료</button>
        </div>
      </div>
      <pre class="terminal-screen" id="terminalScreen">(실행 중인 agy 로그가 여기에 실시간으로 표시됩니다...)</pre>
    </div>
  </div>

  <div class="toast" id="toast">
    <span id="toastIcon">ℹ️</span>
    <span id="toastMsg">알림</span>
  </div>

  <script>
    // Determine API Base dynamically whether under /vibe-maker/ or root
    const API_BASE = window.location.pathname.startsWith('/vibe-maker') ? '/vibe-maker/api' : '/api';
    let currentMode = 'modify';
    let isRecording = false;
    let sttLang = 'ko-KR';
    let recognition = null;
    let ws = null;
    let currentSessionName = null;

    // Toast function
    function showToast(msg, icon = 'ℹ️') {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      document.getElementById('toastIcon').innerText = icon;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // Set Mode: modify vs create
    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btnModeModify').classList.toggle('active', mode === 'modify');
      document.getElementById('btnModeCreate').classList.toggle('active', mode === 'create');
      document.getElementById('groupAppSelect').style.display = mode === 'modify' ? 'flex' : 'none';
      document.getElementById('groupNewApp').style.display = mode === 'create' ? 'flex' : 'none';
    }

    // Add snippet to prompt textarea
    function addPromptSnippet(text) {
      const promptEl = document.getElementById('promptInput');
      promptEl.value = promptEl.value ? `${promptEl.value}\n${text}` : text;
      promptEl.focus();
    }

    // Toggle STT Language
    function toggleLang() {
      sttLang = sttLang === 'ko-KR' ? 'en-US' : 'ko-KR';
      document.getElementById('btnLang').innerText = sttLang === 'ko-KR' ? '🇰🇷 KO' : '🇺🇸 EN';
      if (recognition) recognition.lang = sttLang;
      showToast(`음성 인식 언어가 [${sttLang}]로 변경되었습니다.`);
    }

    // Load Apps List
    async function loadApps() {
      try {
        const res = await fetch(`${API_BASE}/apps`);
        const data = await res.json();
        if (data.ok) {
          const select = document.getElementById('appSelect');
          select.innerHTML = '';
          document.getElementById('appCount').innerText = `총 ${data.apps.length}개 발견`;
          
          data.apps.forEach(app => {
            const opt = document.createElement('option');
            opt.value = app.path;
            const kwBadge = app.isRegisteredInKwboard ? '⭐[KW보드]' : '⚪[미등재]';
            const techBadge = app.hasPackageJson ? '📦' : app.hasGit ? '🌿' : '📁';
            opt.innerText = `${kwBadge} ${techBadge} ${app.name} (${app.category})`;
            select.appendChild(opt);
          });
        }
      } catch (e) {
        document.getElementById('appCount').innerText = '목록 로드 실패';
      }
    }

    function onAppSelectChange() {
      // Optional: prefill prompt or title
    }

    // Setup Web Speech Recognition (STT)
    function setupSTT() {
      const SpeechClass = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechClass) return;

      recognition = new SpeechClass();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = sttLang;

      recognition.onresult = (event) => {
        let interim = '';
        let finalStr = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalStr += event.results[i][0].transcript + ' ';
          } else {
            interim += event.results[i][0].transcript;
          }
        }
        
        const preview = document.getElementById('interimPreview');
        if (interim) {
          preview.style.display = 'block';
          preview.innerText = '인식 중: ' + interim;
        } else {
          preview.style.display = 'none';
        }

        if (finalStr) {
          const input = document.getElementById('promptInput');
          input.value = (input.value ? input.value + ' ' : '') + finalStr;
        }
      };

      recognition.onerror = (e) => {
        console.warn('STT error:', e.error);
        stopRecording();
      };

      recognition.onend = () => {
        stopRecording();
      };
    }

    function toggleRecording() {
      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    }

    function startRecording() {
      if (!recognition) {
        showToast('이 브라우저는 음성 인식을 지원하지 않습니다.', '⚠️');
        return;
      }
      try {
        recognition.lang = sttLang;
        recognition.start();
        isRecording = true;
        document.getElementById('btnMic').classList.add('recording');
        document.getElementById('micLabel').innerText = '녹음 중 (터치하여 중지)';
        document.getElementById('micIcon').innerText = '⏹️';
        showToast('마이크에 말씀하세요...', '🎙️');
      } catch (e) {
        console.error(e);
      }
    }

    function stopRecording() {
      isRecording = false;
      document.getElementById('btnMic').classList.remove('recording');
      document.getElementById('micLabel').innerText = '마이크 음성 인식 시작';
      document.getElementById('micIcon').innerText = '🎤';
      document.getElementById('interimPreview').style.display = 'none';
      try { recognition && recognition.stop(); } catch {}
    }

    // Execute Vibe Maker
    async function executeVibe() {
      const prompt = document.getElementById('promptInput').value.trim();
      if (!prompt) {
        showToast('작업 명령 내용을 입력해주세요.', '⚠️');
        return;
      }

      const btn = document.getElementById('btnExecute');
      btn.disabled = true;
      btn.innerHTML = '<span>⏳ agy 구동 중...</span>';

      const payload = {
        mode: currentMode,
        appPath: document.getElementById('appSelect').value,
        newAppName: document.getElementById('newAppName').value,
        prompt,
      };

      try {
        const res = await fetch(`${API_BASE}/execute`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (data.ok) {
          showToast(data.message, '🚀');
          currentSessionName = data.sessionName;
          document.getElementById('sessionStatusBadge').innerText = 'agy 실행 중';
        } else {
          showToast('오류: ' + data.error, '❌');
        }
      } catch (e) {
        showToast('서버 통신 실패: ' + e.message, '❌');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>⚡ agy 실행하기 (YOLO 모드)</span>';
      }
    }

    // Send Ctrl+C or Kill session
    async function sendAction(action) {
      if (!currentSessionName) {
        showToast('활성화된 agy 세션이 없습니다.', 'ℹ️');
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/session-action`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session: currentSessionName, action }),
        });
        const data = await res.json();
        showToast(data.message || '완료', '✅');
      } catch (e) {
        showToast('실패: ' + e.message, '❌');
      }
    }

    // Setup Live WebSocket Log Stream
    function setupWebSocket() {
      const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${proto}//${window.location.host}/vibe-maker/`;
      try {
        ws = new WebSocket(wsUrl);

        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.text) {
              const screen = document.getElementById('terminalScreen');
              screen.innerText = data.text;
              screen.scrollTop = screen.scrollHeight;
            }
            if (data.session) {
              currentSessionName = data.session;
              document.getElementById('sessionStatusBadge').innerText = 'agy 작업 중';
            } else if (data.sessions && data.sessions.length === 0) {
              document.getElementById('sessionStatusBadge').innerText = '대기 중';
            }
          } catch {}
        };

        ws.onclose = () => {
          setTimeout(setupWebSocket, 3000);
        };
      } catch (e) {
        console.warn('WS error:', e);
      }
    }

    window.onload = () => {
      loadApps();
      setupSTT();
      setupWebSocket();
    };
  </script>
</body>
</html>
