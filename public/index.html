<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>바이브 제작 / 수정 (Vibe Maker)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪄</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131b2e;
      --card-border: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #8b5cf6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      line-height: 1.5;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(139, 92, 246, 0.2));
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 1px solid rgba(139, 92, 246, 0.3);
    }

    .logo-text h1 {
      font-size: 1.15rem;
      font-weight: 800;
      background: linear-gradient(90deg, #60a5fa, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-text p {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 999px;
      font-size: 0.75rem;
      color: #34d399;
      font-weight: 600;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Card Box */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Mode Switcher */
    .segmented-control {
      display: flex;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      padding: 3px;
      gap: 4px;
    }

    .segment-btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .segment-btn.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.35);
    }

    .subfilter-btn {
      flex: 1;
      padding: 6px 8px;
      font-size: 0.78rem;
      font-weight: 700;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .subfilter-btn.active {
      background: rgba(59, 130, 246, 0.2);
      border-color: var(--primary);
      color: #93c5fd;
    }

    optgroup {
      background: #0f172a;
      color: #94a3b8;
      font-weight: 700;
    }
    optgroup option {
      background: #131b2e;
      color: #f1f5f9;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    select, input[type="text"], textarea {
      width: 100%;
      padding: 12px 14px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    select:focus, input[type="text"]:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
    }

    textarea {
      resize: vertical;
      min-height: 120px;
      line-height: 1.6;
    }

    /* Voice / STT Section */
    .voice-control-box {
      display: flex;
      gap: 8px;
    }

    .mic-btn {
      flex: 1;
      padding: 14px;
      border: 1px solid rgba(239, 68, 68, 0.3);
      background: rgba(239, 68, 68, 0.1);
      color: #fca5a5;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mic-btn.recording {
      background: #ef4444;
      color: white;
      border-color: #ef4444;
      animation: micPulse 1.2s infinite alternate;
    }

    @keyframes micPulse {
      from { box-shadow: 0 0 8px rgba(239, 68, 68, 0.4); }
      to { box-shadow: 0 0 20px rgba(239, 68, 68, 0.85); }
    }

    .stt-lang-btn {
      padding: 0 14px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .interim-preview {
      font-size: 0.82rem;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 8px 12px;
      border-radius: 6px;
      border-left: 3px solid #38bdf8;
      font-style: italic;
      display: none;
    }

    /* Execute Button */
    .btn-execute {
      padding: 16px;
      border: none;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.35);
      transition: transform 0.15s, opacity 0.15s;
    }

    .btn-execute:active {
      transform: scale(0.98);
    }

    .btn-execute:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Terminal Output Monitor */
    .terminal-card {
      background: #080c14;
      border: 1px solid #1e293b;
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .terminal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
    }

    .terminal-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .terminal-actions {
      display: flex;
      gap: 6px;
    }

    .action-pill {
      padding: 4px 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      color: #cbd5e1;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
    }

    .action-pill.danger {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.3);
    }

    pre.terminal-screen {
      padding: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      line-height: 1.45;
      color: #38bdf8;
      background: #060911;
      max-height: 280px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* Quick Preset Chips */
    .presets-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .presets-bar::-webkit-scrollbar { display: none; }

    .preset-chip {
      padding: 6px 10px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 999px;
      font-size: 0.75rem;
      color: #cbd5e1;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
    }

    .preset-chip:active {
      background: rgba(59, 130, 246, 0.2);
      border-color: var(--primary);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1e293b;
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transition: transform 0.25s ease;
      z-index: 999;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div class="logo-area">
        <div class="logo-icon">🪄</div>
        <div class="logo-text">
          <h1>바이브 제작 / 수정</h1>
          <p>모바일 음성·텍스트로 agy (YOLO) 원격 실행</p>
        </div>
      </div>
      <div class="header-badge">
        <div class="pulse-dot"></div>
        <span id="sessionStatusBadge">세션 대기 중</span>
      </div>
    </header>

    <!-- App Selection / Creation Card -->
    <div class="card">
      <div class="card-title">
        <span>🎯 작업 대상 선택</span>
      </div>

      <!-- Segmented Mode Control -->
      <div class="segmented-control">
        <button class="segment-btn active" id="btnModeModify" onclick="setMode('modify')">
          🛠️ 기존 앱 수정
        </button>
        <button class="segment-btn" id="btnModeCreate" onclick="setMode('create')">
          ✨ 신규 앱 제작
        </button>
      </div>

      <!-- Modify Mode App Dropdown with Sub-filter -->
      <div class="form-group" id="groupAppSelect">
        <label class="form-label" for="appSelect">
          <span>앱 폴더 선택</span>
          <span id="appCount" style="color: #64748b;">로딩 중...</span>
        </label>
        
        <!-- App Category Filter Tabs -->
        <div class="app-subfilter-tabs" style="display: flex; gap: 6px; margin-bottom: 6px;">
          <button type="button" class="subfilter-btn active" id="filterKwboard" onclick="setAppFilter('kwboard')">
            ⭐ KW보드 등재앱 (<span id="countKwboard">0</span>)
          </button>
          <button type="button" class="subfilter-btn" id="filterUnregistered" onclick="setAppFilter('unregistered')">
            ⚪ 기타/미등재 폴더 (<span id="countUnreg">0</span>)
          </button>
          <button type="button" class="subfilter-btn" id="filterAll" onclick="setAppFilter('all')">
            전체 보기
          </button>
        </div>

        <select id="appSelect" onchange="onAppSelectChange()">
          <option value="">앱 폴더 목록을 불러오는 중...</option>
        </select>
      </div>

      <!-- Create Mode Name Input -->
      <div class="form-group" id="groupNewApp" style="display: none;">
        <label class="form-label" for="newAppName">새 앱 영문 폴더명 (예: my-calculator)</label>
        <input type="text" id="newAppName" placeholder="예: speech-todo, lotto-game, recipe-finder">
      </div>
    </div>

    <!-- Prompt & Voice Command Card -->
    <div class="card">
      <div class="card-title">
        <span>🎙️ 음성 인식 & 작업 명령 (프롬프트)</span>
      </div>

      <!-- Voice Recording Controls -->
      <div class="voice-control-box">
        <button class="mic-btn" id="btnMic" onclick="toggleRecording()">
          <span id="micIcon">🎤</span>
          <span id="micLabel">마이크 음성 인식 시작</span>
        </button>
        <button class="stt-lang-btn" id="btnLang" onclick="toggleLang()">
          🇰🇷 KO
        </button>
      </div>

      <div class="interim-preview" id="interimPreview"></div>

      <!-- Quick Template Chips -->
      <div class="presets-bar">
        <div class="preset-chip" onclick="addPromptSnippet('전체 UI를 모바일 반응형으로 예쁘고 모던하게 리팩토링해줘.')">🎨 모바일 UI 리팩토링</div>
        <div class="preset-chip" onclick="addPromptSnippet('현재 코드의 버그를 찾고 콘솔 오류를 완벽하게 고쳐줘.')">🐛 버그 수정</div>
        <div class="preset-chip" onclick="addPromptSnippet('새로운 다크모드 테마와 로컬스토리지 저장 기능을 추가해줘.')">🌙 다크모드 추가</div>
        <div class="preset-chip" onclick="addPromptSnippet('HTML/JS/CSS 단일 파일로 동작하는 재미있는 미니 웹앱을 완성해줘.')">🚀 미니앱 완성</div>
      </div>

      <!-- Main Prompt Textarea -->
      <div class="form-group">
        <textarea id="promptInput" placeholder="여기에 무엇을 만들거나 수정할지 말하거나 적으세요...&#10;예) 이 앱에 음성 녹음 기능과 자동 저장 버튼을 만들어줘."></textarea>
      </div>

      <!-- Execute YOLO Button -->
      <button class="btn-execute" id="btnExecute" onclick="executeVibe()">
        <span>⚡ agy 실행하기 (YOLO 모드)</span>
      </button>
    </div>

    <!-- Realtime Live Monitor Screen -->
    <div class="terminal-card">
      <div class="terminal-header">
        <div class="terminal-title">
          <span>💻 실시간 터미널 모니터링</span>
        </div>
        <div class="terminal-actions">
          <button class="action-pill" onclick="sendAction('ctrl-c')">⏹️ 중단(Ctrl+C)</button>
          <button class="action-pill danger" onclick="sendAction('kill')">🗑️ 세션 종료</button>
        </div>
      </div>
      <pre class="terminal-screen" id="terminalScreen">(실행 중인 agy 로그가 여기에 실시간으로 표시됩니다...)</pre>
    </div>

    <!-- Recent Command & Execution Log History (30 Days Retention) -->
    <div class="card" style="margin-top: 8px;">
      <div class="card-title" style="justify-content: space-between;">
        <span>📜 최근 명령 & 실행 로그 내역 (30일 보관)</span>
        <button class="action-pill" onclick="loadHistoryList()">🔄 새로고침</button>
      </div>
      <div id="historyContainer" class="history-list" style="display: flex; flex-direction: column; gap: 10px; max-height: 380px; overflow-y: auto;">
        <div style="color: #64748b; font-size: 0.85rem; text-align: center; padding: 12px;">이력을 불러오는 중...</div>
      </div>
    </div>
  </div>

  <!-- Log Detail Modal -->
  <div id="logModal" class="modal" style="display:none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000; align-items: center; justify-content: center; padding: 16px;">
    <div style="background: #0f172a; border: 1px solid #334155; border-radius: 12px; width: 100%; max-width: 680px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.6);">
      <div style="padding: 14px 16px; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; background: #131b2e;">
        <div style="font-weight: 700; color: #f1f5f9; font-size: 0.92rem;" id="modalLogTitle">📜 실행 로그 상세</div>
        <button onclick="closeLogModal()" style="background: transparent; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer;">✕</button>
      </div>
      <div style="padding: 12px 16px; background: #080c14; border-bottom: 1px solid #1e293b; font-size: 0.8rem; color: #94a3b8;" id="modalLogMeta"></div>
      <pre style="margin: 0; padding: 14px; background: #060911; color: #38bdf8; font-family: 'JetBrains Mono', monospace; font-size: 0.76rem; line-height: 1.45; overflow-y: auto; flex: 1; white-space: pre-wrap; word-break: break-all;" id="modalLogBody">로그를 불러오는 중...</pre>
    </div>
  </div>

  <div class="toast" id="toast">
    <span id="toastIcon">ℹ️</span>
    <span id="toastMsg">알림</span>
  </div>

  <script>
    // Determine API Base dynamically: when accessed via Nginx /vibe-maker/, proxy_pass strips to /, so /api is used.
    const API_BASE = '/api';
    let currentMode = 'modify';
    let isRecording = false;
    let sttLang = 'ko-KR';
    let recognition = null;
    let ws = null;
    let currentSessionName = null;

    // Toast function
    function showToast(msg, icon = 'ℹ️') {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      document.getElementById('toastIcon').innerText = icon;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // Set Mode: modify vs create
    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btnModeModify').classList.toggle('active', mode === 'modify');
      document.getElementById('btnModeCreate').classList.toggle('active', mode === 'create');
      document.getElementById('groupAppSelect').style.display = mode === 'modify' ? 'flex' : 'none';
      document.getElementById('groupNewApp').style.display = mode === 'create' ? 'flex' : 'none';
    }

    // Add snippet to prompt textarea
    function addPromptSnippet(text) {
      const promptEl = document.getElementById('promptInput');
      promptEl.value = promptEl.value ? `${promptEl.value}\n${text}` : text;
      promptEl.focus();
    }

    // Toggle STT Language
    function toggleLang() {
      sttLang = sttLang === 'ko-KR' ? 'en-US' : 'ko-KR';
      document.getElementById('btnLang').innerText = sttLang === 'ko-KR' ? '🇰🇷 KO' : '🇺🇸 EN';
      if (recognition) recognition.lang = sttLang;
      showToast(`음성 인식 언어가 [${sttLang}]로 변경되었습니다.`);
    }

    let allAppsData = [];
    let currentAppFilter = 'kwboard';

    function setAppFilter(filter) {
      currentAppFilter = filter;
      document.getElementById('filterKwboard').classList.toggle('active', filter === 'kwboard');
      document.getElementById('filterUnregistered').classList.toggle('active', filter === 'unregistered');
      document.getElementById('filterAll').classList.toggle('active', filter === 'all');
      renderAppSelect();
    }

    function renderAppSelect() {
      const select = document.getElementById('appSelect');
      select.innerHTML = '';

      const kwboardApps = allAppsData.filter(a => a.isRegisteredInKwboard);
      const unregApps = allAppsData.filter(a => !a.isRegisteredInKwboard);

      document.getElementById('countKwboard').innerText = kwboardApps.length;
      document.getElementById('countUnreg').innerText = unregApps.length;

      if (currentAppFilter === 'kwboard') {
        document.getElementById('appCount').innerText = `등재 앱 ${kwboardApps.length}개 표시 중`;
        kwboardApps.forEach(app => {
          const opt = document.createElement('option');
          opt.value = app.path;
          const techBadge = app.hasPackageJson ? '📦' : app.hasGit ? '🌿' : '📁';
          opt.innerText = `⭐ ${app.name} (${techBadge} ${app.category})`;
          select.appendChild(opt);
        });
      } else if (currentAppFilter === 'unregistered') {
        document.getElementById('appCount').innerText = `미등재 폴더 ${unregApps.length}개 표시 중`;
        unregApps.forEach(app => {
          const opt = document.createElement('option');
          opt.value = app.path;
          const techBadge = app.hasPackageJson ? '📦' : app.hasGit ? '🌿' : '📁';
          opt.innerText = `⚪ ${app.name} (${techBadge} ${app.category})`;
          select.appendChild(opt);
        });
      } else {
        // All with optgroups
        document.getElementById('appCount').innerText = `전체 ${allAppsData.length}개`;

        if (kwboardApps.length > 0) {
          const groupKw = document.createElement('optgroup');
          groupKw.label = `⭐ [KW보드 등재 앱] (${kwboardApps.length}개)`;
          kwboardApps.forEach(app => {
            const opt = document.createElement('option');
            opt.value = app.path;
            const techBadge = app.hasPackageJson ? '📦' : app.hasGit ? '🌿' : '📁';
            opt.innerText = `⭐ ${app.name} (${techBadge})`;
            groupKw.appendChild(opt);
          });
          select.appendChild(groupKw);
        }

        if (unregApps.length > 0) {
          const groupUnreg = document.createElement('optgroup');
          groupUnreg.label = `⚪ [기타 / 미등재 폴더] (${unregApps.length}개)`;
          unregApps.forEach(app => {
            const opt = document.createElement('option');
            opt.value = app.path;
            const techBadge = app.hasPackageJson ? '📦' : app.hasGit ? '🌿' : '📁';
            opt.innerText = `⚪ ${app.name} (${techBadge})`;
            groupUnreg.appendChild(opt);
          });
          select.appendChild(groupUnreg);
        }
      }
    }

    // Load Apps List
    async function loadApps() {
      try {
        const res = await fetch(`${API_BASE}/apps`);
        const data = await res.json();
        if (data.ok) {
          allAppsData = data.apps || [];
          renderAppSelect();
        }
      } catch (e) {
        document.getElementById('appCount').innerText = '목록 로드 실패';
      }
    }

    function onAppSelectChange() {
      // Optional: prefill prompt or title
    }

    let recognitionInstance = null;
    let currentSessionTranscript = '';

    function toggleRecording() {
      if (isRecording) {
        // Stop recording like VoiceGit
        if (recognitionInstance) {
          try { recognitionInstance.stop(); } catch {}
        }
        isRecording = false;
        document.getElementById('btnMic').classList.remove('recording');
        document.getElementById('micLabel').innerText = '마이크 음성 인식 시작';
        document.getElementById('micIcon').innerText = '🎤';
        document.getElementById('interimPreview').style.display = 'none';

        // Append final transcript
        const input = document.getElementById('promptInput');
        const prev = input.value;
        const add = currentSessionTranscript.trim();
        if (add) {
          input.value = prev ? (prev + (prev.endsWith('\n') ? '' : ' ') + add) : add;
        }
        currentSessionTranscript = '';
        showToast('녹음이 완료되어 텍스트에 반영되었습니다.', '✅');
      } else {
        // Start recording like VoiceGit
        const SpeechClass = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechClass) {
          showToast('이 브라우저는 음성 인식을 지원하지 않습니다.', '⚠️');
          return;
        }

        currentSessionTranscript = '';
        const rec = new SpeechClass();
        rec.continuous = true;
        rec.interimResults = true;
        rec.lang = sttLang;

        rec.onresult = (event) => {
          let current = '';
          for (let i = 0; i < event.results.length; ++i) {
            current += event.results[i][0].transcript + (event.results[i].isFinal ? ' ' : '');
          }
          currentSessionTranscript = current;
          const preview = document.getElementById('interimPreview');
          if (current) {
            preview.style.display = 'block';
            preview.innerText = '🎙️ 인식 중: ' + current;
          }
        };

        rec.onerror = (event) => {
          console.error('Speech recognition error', event.error);
          isRecording = false;
          document.getElementById('btnMic').classList.remove('recording');
          document.getElementById('micLabel').innerText = '마이크 음성 인식 시작';
          document.getElementById('micIcon').innerText = '🎤';
          document.getElementById('interimPreview').style.display = 'none';
          showToast('음성 인식 오류: ' + event.error, '❌');
        };

        rec.onend = () => {
          if (isRecording) {
            // Auto restart if stopped unexpectedly while active
            try { rec.start(); } catch {}
          }
        };

        try {
          rec.start();
          recognitionInstance = rec;
          isRecording = true;
          document.getElementById('btnMic').classList.add('recording');
          document.getElementById('micLabel').innerText = '녹음 중... (말씀 후 터치하여 완료)';
          document.getElementById('micIcon').innerText = '⏹️';
          document.getElementById('interimPreview').style.display = 'block';
          document.getElementById('interimPreview').innerText = '🎙️ 마이크에 편하게 말씀하세요...';
          showToast('음성 인식을 시작합니다.', '🎙️');
        } catch (e) {
          console.error('Start error:', e);
          showToast('마이크 시작 실패: ' + e.message, '❌');
        }
      }
    }

    // Execute Vibe Maker
    async function executeVibe() {
      const prompt = document.getElementById('promptInput').value.trim();
      if (!prompt) {
        showToast('작업 명령 내용을 입력해주세요.', '⚠️');
        return;
      }

      const btn = document.getElementById('btnExecute');
      btn.disabled = true;
      btn.innerHTML = '<span>⏳ agy 구동 중...</span>';

      const payload = {
        mode: currentMode,
        appPath: document.getElementById('appSelect').value,
        newAppName: document.getElementById('newAppName').value,
        prompt,
      };

      try {
        const res = await fetch(`${API_BASE}/execute`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (data.ok) {
          showToast(data.message, '🚀');
          currentSessionName = data.sessionName;
          document.getElementById('sessionStatusBadge').innerText = 'agy 실행 중';
        } else {
          showToast('오류: ' + data.error, '❌');
        }
      } catch (e) {
        showToast('서버 통신 실패: ' + e.message, '❌');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>⚡ agy 실행하기 (YOLO 모드)</span>';
      }
    }

    // Send Ctrl+C or Kill session
    async function sendAction(action) {
      if (!currentSessionName) {
        showToast('활성화된 agy 세션이 없습니다.', 'ℹ️');
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/session-action`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session: currentSessionName, action }),
        });
        const data = await res.json();
        showToast(data.message || '완료', '✅');
      } catch (e) {
        showToast('실패: ' + e.message, '❌');
      }
    }

    // Setup Live Terminal Screen Monitor (WebSocket + HTTP Polling Fallback)
    async function updateScreenHttp() {
      try {
        const res = await fetch(`${API_BASE}/screen-live`);
        const data = await res.json();
        if (data.ok && data.active) {
          const screen = document.getElementById('terminalScreen');
          screen.innerText = data.output || '(실행 중...)';
          screen.scrollTop = screen.scrollHeight;
          document.getElementById('sessionStatusBadge').innerText = 'agy 작업 중';
          currentSessionName = data.session;
        }
      } catch {}
    }

    function setupWebSocket() {
      const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${proto}//${window.location.host}/vibe-maker/`;
      try {
        ws = new WebSocket(wsUrl);

        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.text) {
              const screen = document.getElementById('terminalScreen');
              screen.innerText = data.text;
              screen.scrollTop = screen.scrollHeight;
            }
            if (data.session) {
              currentSessionName = data.session;
              document.getElementById('sessionStatusBadge').innerText = 'agy 작업 중';
            } else if (data.sessions && data.sessions.length === 0) {
              document.getElementById('sessionStatusBadge').innerText = '대기 중';
            }
          } catch {}
        };

        ws.onclose = () => {
          setTimeout(setupWebSocket, 3000);
        };
      } catch (e) {
        console.warn('WS error:', e);
      }

      // Always poll HTTP every 2 seconds as robust fallback
      setInterval(updateScreenHttp, 2000);
    }

    // Load & Render Command History (30 Days)
    async function loadHistoryList() {
      const container = document.getElementById('historyContainer');
      try {
        const res = await fetch(`${API_BASE}/history`);
        const data = await res.json();
        if (data.ok && Array.isArray(data.history) && data.history.length > 0) {
          container.innerHTML = '';
          data.history.forEach(item => {
            const dateStr = item.timestamp ? new Date(item.timestamp).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
            const card = document.createElement('div');
            card.style.cssText = 'background: #0b1120; border: 1px solid #1e293b; border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px;';

            const modeBadge = item.mode === 'create' ? '✨ 신규제작' : '🛠️ 기존수정';
            const target = item.targetName || '앱';
            
            card.innerHTML = `
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; align-items: center; gap: 6px;">
                  <span style="background: rgba(59,130,246,0.15); color: #60a5fa; font-size: 0.72rem; font-weight: 700; padding: 2px 6px; border-radius: 4px;">${modeBadge}</span>
                  <span style="font-weight: 700; color: #f8fafc; font-size: 0.88rem;">${target}</span>
                </div>
                <span style="color: #64748b; font-size: 0.75rem;">${dateStr}</span>
              </div>
              <div style="color: #cbd5e1; font-size: 0.82rem; background: #070b14; padding: 8px 10px; border-radius: 6px; border-left: 3px solid #3b82f6; white-space: pre-wrap; word-break: break-all;">${item.prompt || '(명령어 없음)'}</div>
              <div style="display: flex; justify-content: flex-end; gap: 6px; margin-top: 2px;">
                <button class="action-pill" onclick="openLogModal('${item.id}')" style="background: #1e293b; color: #38bdf8; border-color: #334155;">📄 전체 실행 로그 보기</button>
              </div>
            `;
            container.appendChild(card);
          });
        } else {
          container.innerHTML = '<div style="color: #64748b; font-size: 0.85rem; text-align: center; padding: 12px;">최근 30일간 실행된 명령 이력이 없습니다.</div>';
        }
      } catch (e) {
        container.innerHTML = '<div style="color: #ef4444; font-size: 0.85rem; text-align: center; padding: 12px;">이력 로드 실패</div>';
      }
    }

    // Open & View Log Modal
    async function openLogModal(historyId) {
      const modal = document.getElementById('logModal');
      const body = document.getElementById('modalLogBody');
      const meta = document.getElementById('modalLogMeta');
      modal.style.display = 'flex';
      body.innerText = '로그 파일을 읽어오는 중...';

      try {
        const res = await fetch(`${API_BASE}/history-log/${historyId}`);
        const data = await res.json();
        if (data.ok) {
          const item = data.item;
          const dateStr = item.timestamp ? new Date(item.timestamp).toLocaleString('ko-KR') : '';
          meta.innerHTML = `<strong>대상:</strong> ${item.targetName} (${item.targetDir}) | <strong>시각:</strong> ${dateStr}<br><strong>명령:</strong> ${item.prompt}`;
          body.innerText = data.logContent || '(로그 내용이 비어있습니다.)';
        } else {
          body.innerText = '오류: ' + data.error;
        }
      } catch (e) {
        body.innerText = '로그 조회 실패: ' + e.message;
      }
    }

    function closeLogModal() {
      document.getElementById('logModal').style.display = 'none';
    }

    window.onload = () => {
      loadApps();
      loadHistoryList();
      setupWebSocket();
    };
  </script>
</body>
